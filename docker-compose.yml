
services:

  postgres:                # <--- ЭТО ИМЯ ХОСТА
    image: postgres:18.3   
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB}  #${POSTGRES_DB}
#      POSTGRES_HOST: localhost
    env_file:
      - .env  # Можно также загрузить все переменные из файла
    volumes:
      - postgres_data:/var/lib/postgresql   
      #- ./sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      # Монтирует всю папку, где лежат и .sql файлы, и .sh скрипты
      - ./init-scripts:/docker-entrypoint-initdb.d:ro

    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 512M      # Максимальный лимит ОЗУ для контейнера
        reservations:
          memory: 256M      # Резерв памяти при запуске
    shm_size: 256M          # Выделение /dev/shm для внутренних нужд Postgres
#
#
#
    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
#      test: ["CMD-SHELL", "pg_isready -U admin -d postgres && [ -n \"$(env | grep _POSTGRES_INIT_COMPLETED)\" ]"]
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres && [ -f /tmp/init_done ]"]
      interval: 10s
      timeout: 5s
      retries: 100
      start_period: 20s
#    logging:
#      driver: json-file
#      options:
#        max-size: "10m"
#        max-file: "3"


  python_app:
    build: 
      context: ./py-app
##      args:
##        - APP_ENV=${APP_ENV:-production}  # Значение по умолчанию
    container_name: python_data_collector
    restart: unless-stopped  # always
#    command: python main.py
    command: bash /app/entrypoint.sh
#    command: sleep infinity  # Временно, чтобы контейнер не перезапускался
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432 # ${POSTGRES_PORT}
      APP_DB: ${APP_DB}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
##      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: Europe/Moscow # - TZ=Europe/Moscow 
    env_file:
      - .env
##      - .env.local  # Можно добавить несколько файлов (перезаписывают в порядке указания)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./py-app:/app
#      - ./log:/app/log  # Пример дополнительного volume
##    ports:
##      - "${PYTHON_APP_PORT:-8000}:8000"
    networks:
      - app_network
#    deploy:
#      resources:            
#        limits:
#          memory: 512M
#        reservations:
#          memory: 256M
#    logging:
#      driver: json-file
#      options:
#        max-size: "10m"
#        max-file: "3"


  metabase:
    image: metabase/metabase:v0.60.x #latest
    container_name: metabase_ecom
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432 # ${POSTGRES_PORT}   # какой - внутрнений или внешний?    5432 должен быть внутренний
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
#      MB_PASSWORD_COMPLEXITY: ${MB_PASSWORD_COMPLEXITY:-normal}
#      MB_PASSWORD_LENGTH: ${MB_PASSWORD_LENGTH:-8}
#      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}  # Пример опциональной переменной
    env_file:
      - .env
    ports:
      - "${METABASE_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
#    volumes:
#      - metabase_plugins:/plugins  # Дополнительный volume для плагинов
#    logging:
#      driver: json-file
#      options:
#        max-size: "10m"
#        max-file: "3"


volumes:
  postgres_data:
    name: postgres_data 
    driver: local
#  metabase_plugins:
#    name: ${METABASE_VOLUME_NAME:-metabase_plugins}
#    driver: local

networks:
  app_network:
    name: app_network 
    driver: bridge



